<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Geode Drift</title><meta name="theme-color" content="#0b0818">
<link rel="icon" href="icon.png"><link rel="stylesheet" href="style.css">
</head><body>
<canvas id="scene"></canvas>
<div id="fx"></div>
<!-- in-run HUD -->
<div id="runhud" class="hide">
  <div id="timer"><div class="tlabel">TIME</div><div id="tsec">25.0</div><div id="tbar"><i></i></div></div>
  <div id="depthbox"><div id="depth">0<small>m</small></div><div id="zone">Dust Belt</div><div id="gbar"><i></i></div><div id="gnext">Guardian at 150m</div><div id="best"></div></div>
  <div id="runore"></div>
  <div id="bossbar" class="hide"><div id="bossname">Guardian</div><div class="bb"><i></i></div></div>
  <div id="hint">Your rig drills and zaps by itself · click a rock to focus the lasers</div>
</div>
<!-- hub: upgrade web -->
<div id="hub">
  <div id="wallet"></div>
  <div id="treewrap"><div id="tree"><svg id="links"></svg></div></div>
  <div id="nodecard" class="hide"></div>
  <div id="hubbar">
    <div class="brand">GEODE <span>DRIFT</span><div id="recs"></div></div>
    <div class="hubbtns"><button id="novabtn" class="ghost">🌟 Supernova</button><button id="setbtn" class="ghost">⚙</button><button id="launch">LAUNCH ▶<small id="launchsub">25s run</small></button></div>
  </div>
</div>
<div id="toasts"></div>
<div id="modal"><div class="mcard"><div class="mbody"></div><div class="mbtns"><button class="mcancel">Cancel</button><button class="mok">OK</button></div></div></div>
<script src="app.js"></script>
</body></html>
